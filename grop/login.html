<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GROP - 로그인</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Archivo+Black&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/common.css">

    <link
        rel="stylesheet"
        href="css/login.css">

</head>


<body>

    <div class="login-shell stage">

        <!-- =========================================
             왼쪽 히어로 영역
        ========================================== -->

        <section class="hero">

            <div class="hero-content">

                <h1 class="brand">GROP</h1>

                <h2 class="tagline">
                    Focus on Discussion,<br>
                    We Handle the Notes
                </h2>

                <p class="desc">
                    회의의 모든 내용을 자동으로 정리하고<br>
                    문서를 생성하여 협업 효율을 높여보세요.
                </p>

            </div>


            <div class="features">

                <div class="feature-card">
                    <i data-lucide="sparkles"></i>
                    <h3>AI 회의 요약</h3>
                    <p>회의 내용을 AI 분석 및<br>핵심내용 요약</p>
                </div>

                <div class="feature-card">
                    <i data-lucide="file-text"></i>
                    <h3>문서 자동 생성</h3>
                    <p>회의록 문서<br>자동 생성</p>
                </div>

                <div class="feature-card">
                    <i data-lucide="users"></i>
                    <h3>팀 협업</h3>
                    <p>실시간 회의 공유</p>
                </div>

                <div class="feature-card">
                    <i data-lucide="folder"></i>
                    <h3>회의 기록 관리</h3>
                    <p>모든 회의 기록<br>저장 및 관리</p>
                </div>

            </div>

        </section>


        <!-- =========================================
             오른쪽 로그인 패널
        ========================================== -->

        <aside class="login-panel">

            <h1>로그인</h1>
            <p class="subtitle">GROP에 오신 것을 환영합니다!</p>

            <form id="loginForm">

                <div class="field">
                    <label for="email">이메일</label>
                    <input
                        id="email"
                        type="email"
                        placeholder="이메일을 입력하세요"
                        autocomplete="email">
                </div>

                <div class="field">
                    <label for="password">비밀번호</label>
                    <input
                        id="password"
                        type="password"
                        placeholder="비밀번호를 입력하세요"
                        autocomplete="current-password">
                </div>

                <div class="row-between">

                    <label class="checkbox-label">
                        <input type="checkbox" id="remember">
                        로그인 상태 유지
                    </label>

                    <button type="button" class="forgot-link" id="findPassword">
                        비밀번호 찾기
                    </button>

                </div>


                <!-- 에러 / 안내 메시지 -->

                <p id="loginMessage" class="login-message"></p>


                <button type="submit" class="btn btn-primary">로그인</button>

                <div class="divider">또는</div>

                <button type="button" class="btn btn-google" id="googleLogin">
                    <span class="google-g">G</span>
                    Google로 로그인
                </button>

                <button type="button" class="btn btn-github" id="githubLogin">
                    GitHub로 로그인
                </button>

                <p class="signup">
                    계정이 없으신가요?
                    <a href="signup.html">회원가입</a>
                </p>

            </form>

        </aside>

    </div>


    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="js/auth-utils.js"></script>
    <script src="js/login.js" defer></script>

</body>

</html>
