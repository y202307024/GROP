<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GROP - 회원가입</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/common.css">

    <link
        rel="stylesheet"
        href="css/signup.css">

</head>


<body>

    <div class="signup-shell stage">

        <!-- =========================================
             왼쪽 소개 영역
        ========================================== -->

        <section class="signup-left">

            <h1 class="brand">GROP</h1>

            <h2 class="headline">
                팀의 아이디어<br>
                기록하고 성장시키세요
            </h2>

            <p class="subtext">
                화이트보드 협업부터 AI요약, 문서화까지<br>
                GROP 하나로 스마트한 회의를 완성하세요.
            </p>

            <p class="login-footer">
                이미 계정이 있으신가요?
                <a href="login.html">로그인</a>
            </p>

        </section>


        <!-- =========================================
             오른쪽 회원가입 폼
        ========================================== -->

        <section class="signup-right">

            <h1>회원가입</h1>
            <p class="subtitle">계정을 만들고 GROP의 모든 기능을 경험해보세요.</p>

            <div class="social-row">

                <button type="button" class="btn btn-google" id="googleSignup">
                    <span class="google-g">G</span>
                    Google로 회원가입
                </button>

                <button type="button" class="btn btn-github" id="githubSignup">
                    GitHub로 회원가입
                </button>

            </div>

            <div class="divider">또는</div>

            <div>

                <div class="field">
                    <label for="name">이름</label>
                    <input id="name" type="text" placeholder="이름을 입력하세요">
                </div>

                <div class="field">
                    <label for="email">이메일</label>
                    <input id="email" type="email" placeholder="이메일 주소를 입력하세요">
                </div>

                <div class="field">
                    <label for="password">비밀번호</label>
                    <input id="password" type="password" placeholder="비밀번호를 입력하세요">
                    <p class="helper" id="passwordHelp">6자 이상 입력해주세요.</p>
                </div>

                <div class="field">
                    <label for="password-confirm">비밀번호 확인</label>
                    <input id="password-confirm" type="password" placeholder="비밀번호를 다시 입력하세요">
                </div>

                <div class="field">
                    <label for="org">소속 (선택)</label>
                    <input id="org" type="text" placeholder="학교 또는 회사명을 입력하세요">
                </div>

                <div class="agree-row">
                    <input type="checkbox" id="agree">
                    <label for="agree">
                        서비스 <a href="#">이용약관</a> 및 <a href="#">개인정보 처리방침</a>에 동의합니다.
                    </label>
                </div>


                <!-- 에러 / 안내 메시지 -->

                <p id="signupMessage" class="signup-message"></p>


                <button type="button" class="btn btn-primary" id="signupButton">회원가입 완료하기</button>

                <p class="fine-print">
                    가입하면 GROP의 <a href="#">이용약관</a> 및 <a href="#">개인정보 처리방침</a>에 동의하게 됩니다.
                </p>

            </div>

        </section>

    </div>


    <script src="js/auth-utils.js"></script>
    <script src="js/signup.js"></script>

</body>

</html>
