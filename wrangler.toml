# Vite 빌드 결과(dist)를 Cloudflare Workers 정적 사이트로 배포합니다.
# 없는 주소는 index.html 로 보내 새로고침해도 React Router 화면이 열리게 합니다.
# 페이지 접속도 워커가 먼저 봐야 server_logs 에 남습니다.
# 서비스 롤 키는 이 파일에 적지 않습니다. 배포 환경의 비밀 값으로만 둡니다.
name = "grop"
main = "worker/index.js"
compatibility_date = "2026-10-22"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
SUPABASE_URL = "https://orqevibktvxkyslyrnwb.supabase.co"

# 비밀키 없이 버킷 목록만 읽습니다. 브라우저 번들에는 키가 들어가지 않습니다.
[[r2_buckets]]
binding = "MEETING_VIDEOS"
bucket_name = "grop-meeting-videos"
